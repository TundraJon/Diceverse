<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DiceVerse</title>
<style>:root {
  --felt-1: #134e3a;
  --felt-2: #08211a;
  --gold: #fbbf24;
  --gold-2: #d99a0b;
  --ink: #0f172a;
  --panel: rgba(0, 0, 0, 0.5);
  --line: rgba(255, 255, 255, 0.12);
  --danger: #dc2626;
  --text: #f8fafc;
  --muted: #94a3b8;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: var(--text);
  background: radial-gradient(circle at center, var(--felt-1) 0%, var(--felt-2) 100%) fixed;
  min-height: 100dvh;
}
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { opacity: 0.45; cursor: not-allowed; }
button:focus-visible, select:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

#app { max-width: 480px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }
.screen { flex: 1; display: flex; flex-direction: column; padding: 12px 16px 16px; gap: 12px; }

header.bar { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; }
header.bar h1 { margin: 0; font-size: 1.15rem; letter-spacing: 0.06em; color: var(--gold); }
.icon-btn { min-height: 44px; min-width: 44px; padding: 0 14px; background: rgba(255,255,255,0.08); border: 1px solid var(--line); border-radius: 22px; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; backdrop-filter: blur(6px); }
.panel h2 { margin: 0 0 8px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }

/* Menu */
.hero { display: flex; align-items: center; gap: 10px; text-align: left; padding: 8px 56px 0 4px; } /* logo and title on one line; the right padding keeps clear of the settings button */
.hero .logo { font-size: 2rem; line-height: 1; }
.hero h1 { margin: 0; font-size: 1.5rem; color: var(--gold); letter-spacing: 0.08em; }
.hero p { display: none; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.seg button { min-height: 48px; background: rgba(255,255,255,0.06); border: 1px solid var(--line); border-radius: 12px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--gold); color: var(--ink); border-color: var(--gold); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.stepper { display: flex; align-items: center; gap: 12px; }
.stepper button { width: 48px; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,0.08); font-size: 1.4rem; }
.stepper span { min-width: 2ch; text-align: center; font-size: 1.4rem; font-weight: 800; color: var(--gold); }
select { min-height: 48px; background: #0b2b21; color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 0 10px; font: inherit; }
.primary { min-height: 56px; border: 0; border-radius: 14px; font-weight: 800; font-size: 1.1rem; color: var(--ink); background: linear-gradient(90deg, var(--gold), var(--gold-2)); }
.secondary { min-height: 48px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,0.08); font-weight: 600; }
.note { color: var(--muted); font-size: 0.85rem; margin: 0; }

/* Sheets */
.sheet-back { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
.sheet { background: #0e1f1a; border: 1px solid var(--line); border-radius: 18px; padding: 0 18px 18px; width: 100%; max-width: 420px; max-height: 85dvh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.sheet h2 { margin: 0; color: var(--gold); font-size: 1.1rem; }
.sheet > :first-child { margin-top: 18px; } /* top spacing as margin so a sticky table header sits flush with the top edge */
.sheet p { margin: 0; line-height: 1.45; }

/* Game */
.scores { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.scores.one { grid-template-columns: 1fr; }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.chip.active { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(251,191,36,0.25); }
.chip .name { font-size: 0.85rem; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
.chip.active .name { color: var(--gold); }
.chip .total { font-size: 1.8rem; font-weight: 800; line-height: 1.1; }
.chip .tp { font-size: 0.85rem; color: var(--gold); min-height: 1.1em; }
.chip .trow { display: flex; align-items: baseline; flex-wrap: wrap; column-gap: 6px; }
.chip .tgt { font-size: 0.85rem; color: var(--muted); white-space: nowrap; }

.table { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; min-height: 220px; position: relative; }
.dice { display: flex; gap: 18px; justify-content: center; }
.die {
  --s: 96px;
  position: relative; width: var(--s); height: var(--s); font-size: var(--s); /* em = the die's size, used by the throw */
  perspective: calc(var(--s) * 5);
}
.die.throwing { z-index: 3; }
.die .tilt { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateX(-14deg) rotateY(-16deg); }
.die .cube { position: absolute; inset: 0; transform-style: preserve-3d; }
.die .face {
  position: absolute; inset: 0; padding: calc(var(--s) * 0.1); border-radius: calc(var(--s) * 0.18);
  background: linear-gradient(145deg, #ffffff, #e3e3e3);
  box-shadow: inset -2px -2px 5px rgba(0,0,0,0.16), inset 2px 2px 4px rgba(255,255,255,0.9);
  backface-visibility: hidden; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr);
}
.die .f1 { transform: translateZ(calc(var(--s) / 2)); }
.die .f6 { transform: rotateY(180deg) translateZ(calc(var(--s) / 2)); }
.die .f3 { transform: rotateY(90deg) translateZ(calc(var(--s) / 2)); }
.die .f4 { transform: rotateY(-90deg) translateZ(calc(var(--s) / 2)); }
.die .f2 { transform: rotateX(90deg) translateZ(calc(var(--s) / 2)); }
.die .f5 { transform: rotateX(-90deg) translateZ(calc(var(--s) / 2)); }
.die .shadow { position: absolute; left: 8%; right: 8%; bottom: -8%; height: 16%; border-radius: 50%; background: rgba(0,0,0,0.4); filter: blur(4px); }
.dice.two .die { --s: 80px; }
.die.blank { opacity: 0.25; }
.pip { align-self: center; justify-self: center; width: 60%; height: 60%; border-radius: 50%; background: var(--ink); box-shadow: inset 1px 1px 3px rgba(0,0,0,0.6); }
.pip.danger { background: var(--danger); }
.banner { position: absolute; top: 6px; padding: 8px 18px; border-radius: 999px; background: var(--danger); color: #fff; font-weight: 800; letter-spacing: 0.08em; }
.turnline { color: var(--muted); text-align: center; min-height: 1.4em; }
.turnline strong { color: var(--gold); }

.controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.controls button { min-height: 64px; border-radius: 16px; border: 0; font-weight: 800; font-size: 1.2rem; }
.btn-roll { background: linear-gradient(90deg, var(--gold), var(--gold-2)); color: var(--ink); }
.btn-bank { background: #0f766e; color: #fff; }
.log { font-size: 0.8rem; color: var(--muted); min-height: 3.9em; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; }

.results { display: flex; flex-direction: column; gap: 6px; }
.results .r { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); }


/* Farkle */
.controls .span2 { grid-column: 1 / -1; }
.controls button { padding: 0 8px; }
.kept { display: flex; gap: 6px; justify-content: center; opacity: 0.55; }
.kept .die { --s: 34px; }
.dice.farkle { gap: 6px; flex-wrap: nowrap; }
.dice.farkle .die { --s: 52px; }
.dieBtn { background: none; border: 0; padding: 4px; border-radius: 14px; min-width: 52px; min-height: 52px; }
.dieBtn:disabled { cursor: default; opacity: 1; }
.dieBtn.sel { box-shadow: 0 0 0 3px var(--gold); background: rgba(251,191,36,0.18); }
.selbadge { min-height: 1.4em; font-weight: 800; color: var(--gold); text-align: center; }
.selbadge.bad { color: #fca5a5; font-weight: 600; }
.helper { min-height: 0; }
.secondary.small { min-height: 40px; padding: 0 14px; font-size: 0.9rem; }
.hint { color: var(--muted); font-size: 0.85rem; text-align: center; min-height: 1.2em; }
.banner.hot { background: var(--gold); color: var(--ink); }
.sheet h2 + .results, .sheet p + h2 { margin-top: 4px; }

/* Test speed 0 (?speed=0): nothing animates or waits visually */
body.fast *, body.fast *::before, body.fast *::after { animation: none !important; transition: none !important; }

/* Farkle scoring comparison table (Name / Classic / Standard) */
.cmp { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
.cmp th, .cmp td { padding: 7px 4px; border-bottom: 1px solid var(--line); text-align: left; font-weight: 400; }
.cmp thead th { position: sticky; top: 0; background: #0e1f1a; color: var(--gold); font-weight: 700; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; z-index: 1; }
.cmp .num { text-align: right; min-width: 4.8em; font-variant-numeric: tabular-nums; }
.cmp .dash { color: var(--muted); }
.cmp tbody tr:nth-child(even) { background: rgba(255,255,255,0.03); }

/* Yacht */
.controls.sticky { position: sticky; bottom: 0; padding: 8px 0 10px; background: linear-gradient(to top, #08211a 70%, rgba(8,33,26,0)); z-index: 5; }
.dice.yacht { gap: 6px; flex-wrap: nowrap; }
.dice.yacht .die { --s: min(56px, calc((100vw - 96px) / 5)); } /* five dice always fit the width */
.dwrap { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.holdTag { font-size: 0.62rem; letter-spacing: 0.08em; color: var(--gold); font-weight: 700; min-height: 0.9em; }
.dieBtn.held { transform: translateY(-8px); box-shadow: 0 0 0 3px var(--gold); background: rgba(251,191,36,0.18); }
.catsheet { margin: 8px 0 4px; }
.cathead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; color: var(--gold); font-size: 0.85rem; }
.cathead span { color: var(--muted); font-size: 0.75rem; }
.ycard { display: flex; flex-direction: column; gap: 4px; }
.ylbl { font-size: 0.62rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.yupper { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
.ylower { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
.ycell { min-height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 1px; padding: 4px 3px; text-align: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; color: var(--text); }
.ylower .ycell { min-height: 58px; }
.ycell .yl { font-size: 0.68rem; font-weight: 700; line-height: 1.1; }
.ycell .yd { font-size: 0.56rem; color: var(--muted); line-height: 1.15; }
.ycell .yv { font-size: 1rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--muted); }
.ycell.open { border-color: rgba(251,191,36,0.5); }
.ycell .yv.prev { color: var(--gold); }
.ycell .yv.zero { color: #fca5a5; }
.ycell.scored { opacity: 0.9; }
.ycell.scored .yv { color: var(--text); }
.ycell.scored .yv.zero { color: #fca5a5; }
.ycell.sel { background: rgba(251,191,36,0.18); border-color: var(--gold); box-shadow: 0 0 0 2px rgba(251,191,36,0.3); }
.ycell:disabled { cursor: default; }
.ycell.extra .yv { color: var(--text); }
.ysub { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--muted); padding: 0 2px; }
.ytot { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 4px; margin-top: 2px; }
.ytot div { background: rgba(0,0,0,0.35); border: 1px solid var(--line); border-radius: 10px; padding: 4px 6px; text-align: center; font-size: 0.62rem; color: var(--muted); display: flex; flex-direction: column; }
.ytot b { font-size: 1.05rem; color: var(--text); }
.ytot .t b { color: var(--gold); }
.cchip.viewed:not(.active) { border-color: var(--muted); }
.cchip[role="button"] { cursor: pointer; }
.cmp.wide .num { min-width: 3.6em; font-size: 0.78rem; }
.cmp.wide th, .cmp.wide td { padding: 6px 3px; font-size: 0.8rem; }
.seg button { line-height: 1.15; padding-top: 6px; padding-bottom: 6px; }
.table.compact { flex: none; min-height: 112px; padding: 4px 0; }
.screen.tight { gap: 10px; }

/* Bot style sub-row inside the Mode panel */
.row.sub { margin-top: 10px; }

/* Shut the Box */
.walnut { background: repeating-linear-gradient(90deg, rgba(0,0,0,0.10) 0 2px, rgba(255,255,255,0.03) 2px 5px, transparent 5px 11px), linear-gradient(180deg, #7a4e2b, #5b3920 60%, #6a4527); }
.table.boxwrap { flex: 1; align-items: stretch; justify-content: flex-start; gap: 0; min-height: 0; padding: 0; }
.boxwrap .turnline { padding: 0 0 6px; min-height: 1.3em; }
.emblem { width: 104px; height: 104px; border-radius: 50%; border: 2px dashed rgba(214,170,70,0.8); box-shadow: 0 0 0 5px rgba(214,170,70,0.18); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.sbox { position: relative; flex: 1; display: flex; flex-direction: column; margin: 0 6px; padding: 10px 8px 10px; border: 3px solid #3f2713; border-radius: 10px; box-shadow: 0 8px 18px rgba(0,0,0,0.5); overflow: hidden; min-height: 0; }
.rail { height: 7px; background: linear-gradient(#3b2412, #5b3920); border-radius: 3px; margin: 2px 0 6px; flex: none; }
.tilegrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px 7px; flex: none; }
.tile { font-family: Georgia, "Times New Roman", serif; font-weight: 700; font-size: clamp(18px, 6vw, 26px); height: clamp(54px, 16.5vw, 64px); border: 0; border-radius: 5px; color: #3b2713; padding: 0; transition: transform 0.2s, box-shadow 0.2s, background 0.2s, color 0.2s;
  background: repeating-linear-gradient(90deg, rgba(120,80,30,0.10) 0 1px, transparent 1px 5px), linear-gradient(180deg, #f0d3a1, #dcb37a 60%, #c99d62); }
.tile.open { box-shadow: 0 6px 0 #9d7440, 0 9px 10px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.5); }
.tile.open:disabled { filter: saturate(0.85) brightness(0.97); cursor: default; opacity: 1; }
.tile.hint { outline: 2px solid rgba(251,191,36,0.55); outline-offset: 1px; }
.tile.sel { outline: 3px solid var(--gold); outline-offset: 2px; transform: translateY(-3px); }
.tile.shut { background: linear-gradient(180deg, #b78d57, #a47a45); color: rgba(59,39,19,0.35); box-shadow: inset 0 3px 6px rgba(0,0,0,0.55); transform: translateY(5px); }
.tile.na { background: linear-gradient(180deg, #8f6a3b, #7f5d33); box-shadow: inset 0 3px 6px rgba(0,0,0,0.6); transform: translateY(5px); color: transparent; }
.tile:disabled { cursor: default; }
@keyframes tileDown { 0% { transform: translateY(0) rotateX(0); } 50% { transform: translateY(-6px) rotateX(70deg); } 100% { transform: translateY(5px) rotateX(0); } }
@keyframes tileUp { 0% { transform: translateY(5px) rotateX(0); } 50% { transform: translateY(-6px) rotateX(-70deg); } 100% { transform: translateY(0) rotateX(0); } }
.tile.anim-down { animation: tileDown 0.38s ease; }
.tile.anim-up { animation: tileUp 0.38s ease; }
.tray { position: relative; flex: 1; min-height: 200px; margin-top: 8px; border-radius: 4px; overflow: hidden; background: radial-gradient(circle at 50% 30%, #1f6a3f, #0f4a2a); box-shadow: inset 0 0 20px rgba(0,0,0,0.55); }
.tdie { position: absolute; }
.tdie .die { --s: clamp(52px, 15vw, 60px); }
.die.cream .face { background: linear-gradient(145deg, #fff6df, #ecd9aa); }
.die.cream .pip { background: #2a1d10; box-shadow: none; }
.trayinfo { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; color: #e5e7eb; font-size: 0.9rem; padding: 0 8px; }
.cover { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 3; border-radius: 4px; transform: translateY(-110%); transition: transform 0.6s ease; pointer-events: none; box-shadow: inset 0 0 22px rgba(0,0,0,0.5); }
.cover.down { transform: translateY(0); }
.emblem.gold { width: min(78vw, 270px); height: min(78vw, 270px); border-color: #f6c945; box-shadow: 0 0 0 6px rgba(246,201,69,0.25), inset 0 0 22px rgba(0,0,0,0.35); position: relative; }
.emblem .cg { white-space: nowrap; font-family: Georgia, "Times New Roman", serif; font-weight: 800; font-size: clamp(15px, 5.4vw, 23px); letter-spacing: 0.04em; color: #ffd966; text-shadow: 0 1px 0 #7a5a10, 0 0 10px rgba(255,217,102,0.55); position: absolute; top: 24%; left: 50%; transform: translateX(-50%); background: rgba(63,39,19,0.92); padding: 4px 12px; border-radius: 6px; border: 1px solid #f6c945; }
.emblem .cs { font-family: Georgia, serif; font-weight: 700; color: #ffd966; font-size: clamp(14px, 4.6vw, 20px); text-align: center; padding: 0 14px; margin-top: 30px; }
@media (max-width: 340px), (max-height: 700px) { .tray { min-height: 170px; } }
@media (prefers-reduced-motion: reduce) { .tile.anim-down, .tile.anim-up { animation: none; } .cover { transition: none; } .tile { transition: none; } }
body.fast .cover { transition: none; }

/* Shut the Box: the NO MOVE / OUT notice sits inside the tray, above the dice and below the sliding cover */
.tray .banner { top: 14px; left: 50%; transform: translateX(-50%); z-index: 2; white-space: nowrap; }

/* Menu: the game picker wraps into rows of three (five games no longer fit on one row) */
.seg.games { grid-auto-flow: row; grid-template-columns: repeat(4, 1fr); grid-auto-columns: auto; }
.seg.games button { min-height: 34px; padding: 2px 4px; font-size: 0.78rem; line-height: 1.1; }
@media (max-width: 340px) { .seg.games button { min-height: 28px; font-size: 0.7rem; } } /* nine games: keep the menu on one screen on a very small phone */
.btnrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Cliffhanger */
.table.climbwrap { flex: none; justify-content: flex-start; align-items: stretch; gap: 6px; min-height: 0; padding: 0; }
.climbchips { display: grid; grid-template-columns: repeat(var(--n, 1), minmax(0, 1fr)); gap: 6px; }
.cchip { min-width: 0; display: flex; align-items: center; gap: 6px; padding: 4px 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; font-size: 0.8rem; }
.cchip.active { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(251,191,36,0.25); }
.cchip i { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.cchip .cn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cchip b { color: var(--gold); font-variant-numeric: tabular-nums; font-size: 0.78rem; }
@media (max-width: 340px) { .cchip { font-size: 0.72rem; padding: 4px 6px; } }
.climbboard { --d: min(26px, calc((100vw - 32px - 12px) / 11 - 4px)); position: relative; border-radius: 12px; overflow: hidden; padding: 6px 6px 8px; border: 1px solid var(--line); }
.peakbg { position: absolute; inset: 0; width: 100%; height: 100%; }
.climbcols { position: relative; z-index: 1; display: flex; align-items: flex-end; justify-content: space-between; }
.ccol { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; }
/* the rope: 1 px, from the center of the top circle to the center of the bottom one (flag row 18 px + gap, and the label + gap, plus half a circle) */
.ccol::before { content: ""; position: absolute; left: 50%; width: 1px; margin-left: -0.5px; top: calc(21px + var(--d) / 2); bottom: calc(0.72rem + 3px + var(--d) / 2); background: #8a5a2b; }
.cd { position: relative; width: var(--d); height: var(--d); border-radius: 50%; background: rgba(8, 28, 40, 0.124); display: grid; grid-template-columns: repeat(2, 1fr); align-content: center; justify-items: center; gap: 1px; padding: calc(var(--d) * 0.18); }
.cd.top { outline: 1px dashed rgba(251,191,36,0.8); }
.cm { width: 100%; aspect-ratio: 1; min-width: 6px; border-radius: 2px; }
/* Cliffhanger figures: one height for all three (--fig), a seat-colored silhouette via a mask, centered on its circle */
.climbboard { --fig: calc(var(--d) * 1.4); }
/* the outer .figw carries the position, the animation and (summit only) the glow; the inner .fig is the masked silhouette (a filter on the masked span itself would be cut off by the mask) */
.figw { position: absolute; left: 50%; top: 50%; z-index: 3; height: var(--fig); transform: translate(-50%, -50%); pointer-events: none; visibility: visible; }
.fig { display: block; width: 100%; height: 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: center; mask-position: center; -webkit-mask-size: contain; mask-size: contain; }
.figw.summit { transform: translate(-50%, -100%); transform-origin: 50% 100%; filter: drop-shadow(0 0 1px #fff) drop-shadow(0 0 1.5px rgba(255,255,255,0.9)); } /* only the figure that has reached the summit gets the white glow */
.figw.summit.pop { animation: figpop 0.35s ease-out; }
.figw.fall { opacity: 0; animation: figfall 1.4s ease-in both; }
@keyframes figpop { from { transform: translate(-50%, -100%) scale(0.5); opacity: 0; } to { transform: translate(-50%, -100%) scale(1); opacity: 1; } }

/* Speech bubble under the talking bot's chip */

@media (prefers-reduced-motion: reduce) { .talkbubble { animation: none; } }

/* Clear saved games: a 🗑 beside each Resume button, the confirm sheet, and the Settings button */
.resumerow { display: grid; grid-template-columns: minmax(0, 1fr) 52px; gap: 8px; }

.die .symface { font-size: calc(var(--s) * 0.5); line-height: 1; text-align: center; filter: drop-shadow(0 0 1px #fff) drop-shadow(0 0 2px #fff) drop-shadow(0 0 4px rgba(255,255,255,0.9)); } /* a light halo so a gray symbol stands out on any body colour */
.die .symface.two { font-size: calc(var(--s) * 0.3); letter-spacing: -0.04em; }
.die.k-green .face { background: linear-gradient(145deg, #6fd68a, #2f9e55); }
.die.k-yellow .face { background: linear-gradient(145deg, #fde68a, #e0b21f); }
.die.k-red .face { background: linear-gradient(145deg, #f58b8b, #c63a3a); }

.salvwrap { justify-content: flex-start; gap: 10px; }

.sslots { display: flex; gap: 4px; flex-wrap: wrap; min-height: 2.3em; align-items: center; }

.badges { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; min-height: 0; }
.badge { background: rgba(251,191,36,0.15); border: 1px solid rgba(251,191,36,0.5); color: var(--gold); border-radius: 999px; padding: 2px 10px; font-size: 0.78rem; }

/* Pirate Plunder: the tile row, the kept and rolled trays */
.pkwrap { justify-content: flex-start; gap: 10px; }

/* Deep Dive: the air, the path (a line, depth bands and the divers) and the status panel */

/* Space Salvage: the fleet of ships (your ship large, the others small), one part per share of the target */

.pggrid { z-index: 1; }

/* Liar's Dice: the Bidding Track board, the players' dice and cups in the middle, your cup, the face buttons and the reveal */

@keyframes ldhit { from { filter: none; transform: scale(1); } to { filter: drop-shadow(0 0 4px #fbbf24); transform: scale(1.18); } }

.ldcupbig { display: inline-block; width: 26px; height: 22px; clip-path: polygon(15% 0, 85% 0, 100% 100%, 0 100%); background: currentColor; }
.ldhand { display: flex; gap: 6px; justify-content: center; align-items: center; min-height: calc(var(--ldd, 32px) + 2px); }
.ldhand .die { --s: var(--ldd, 32px); }
.ldhand.shake .die { animation: ldshake 0.4s ease-in-out 5; }
.ldhand.shake .die:nth-child(2n) { animation-delay: -0.13s; animation-direction: reverse; }
.ldhand.shake .die:nth-child(3n) { animation-delay: -0.27s; }
@keyframes ldshake { 0%, 100% { transform: translate(0, 0) rotate(0); } 20% { transform: translate(-13px, -5px) rotate(-22deg); } 40% { transform: translate(9px, 4px) rotate(18deg); } 60% { transform: translate(-10px, 3px) rotate(-16deg); } 80% { transform: translate(12px, -6px) rotate(20deg); } }
.ldcover { position: fixed; inset: 0; z-index: 40; background: rgba(5,22,18,0.98); display: flex; align-items: center; justify-content: center; padding: 20px; }
.ldcover[hidden] { display: none; }
.ldcoverbox { text-align: center; display: flex; flex-direction: column; gap: 12px; max-width: 320px; }
.ldcoverh { font-size: 1.3rem; font-weight: 800; color: var(--gold); }
.ldcovers { color: var(--muted); font-size: 0.85rem; }
@media (prefers-reduced-motion: reduce) { .ldhand.shake .die, .ldd.hit { animation: none; } }

/* Treasure Trails: the dice, your sheet (four rows of jewels and a chest each), the penalty track and the other players' small sheets */
.trwrap { justify-content: flex-start; gap: 8px; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
.trdice { display: flex; gap: 12px; justify-content: center; padding-top: 6px; }
.trdice .die { --s: clamp(30px, 9.6vw, 44px); }
.die.k-pearl .face { background: linear-gradient(145deg, #ffffff, #cfd8e1); }
.die.k-ruby .face { background: linear-gradient(145deg, #fca5a5, #b91c1c); }
.die.k-gold .face { background: linear-gradient(145deg, #fde68a, #d99a14); }
.die.k-emerald .face { background: linear-gradient(145deg, #86efac, #15803d); }
.die.k-sapphire .face { background: linear-gradient(145deg, #93c5fd, #1d4ed8); }
.die.k-ruby .pip, .die.k-emerald .pip, .die.k-sapphire .pip { background: #fff; box-shadow: inset 1px 1px 3px rgba(0,0,0,0.35); }
.trinfo { min-height: 1.3em; text-align: center; color: var(--gold); font-weight: 700; font-size: 0.9rem; }
.trsheet { display: flex; flex-direction: column; gap: 4px; width: 100%; }
.trrow { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: 8px; background: color-mix(in srgb, var(--gem) 22%, rgba(0,0,0,0.3)); border-left: 3px solid var(--gem); }
.trrow.locked { opacity: 0.45; }
.trc { position: relative; min-height: 38px; padding: 0; border: 0; border-radius: 5px; background: linear-gradient(160deg, #fff, #dfe6ec); color: #1f2937; font-weight: 800; font-size: clamp(9px, 3vw, 13px); display: grid; place-items: center; }
.trc.gone { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.35); }
.trc.mk { background: rgba(255,255,255,0.18); color: rgba(255,255,255,0.7); }
.trc:disabled { opacity: 1; }
.trc.opt { box-shadow: 0 0 0 2px #22d3ee, 0 0 8px rgba(34,211,238,0.8); transform: translateY(-1px); }
.trc b { position: relative; z-index: 1; }
.trc.mk b { font-size: 0.6rem; position: absolute; bottom: 1px; }
.trgem { position: absolute; left: 50%; top: 42%; width: 70%; aspect-ratio: 1; transform: translate(-50%, -50%); clip-path: polygon(50% 0, 100% 38%, 50% 100%, 0 38%); background: linear-gradient(135deg, color-mix(in srgb, var(--gem) 55%, #fff), var(--gem)); pointer-events: none; }
.trchest { position: relative; display: grid; place-items: center; min-height: 38px; opacity: 0.5; }
.trchest.ready { opacity: 1; }
.trchest.open { opacity: 1; }
.trchest svg { width: 80%; height: auto; display: block; }
.trchest .trgem { top: 22%; width: 46%; }
.trlock { position: absolute; right: -1px; bottom: -1px; width: 55%; }
.trlock svg { width: 100%; }
.trfoot { display: flex; align-items: center; justify-content: space-between; width: 100%; font-size: 0.82rem; color: var(--muted); }
.trpen { display: flex; align-items: center; gap: 4px; }
.trpen i { width: 18px; height: 18px; border: 1px solid var(--line); border-radius: 4px; display: grid; place-items: center; font-style: normal; font-size: 0.7rem; color: #fff; }
.trpen i.x { background: var(--danger); border-color: var(--danger); }
.trtot { color: var(--gold); font-weight: 800; }
.trminis { display: flex; gap: 6px; width: 100%; justify-content: center; }
.trmini { flex: 1; min-width: 0; background: rgba(0,0,0,0.28); border-radius: 8px; padding: 4px 5px; border: 1px solid transparent; }
.trmini.on { border-color: var(--gold); }
.trmh { display: flex; align-items: center; gap: 4px; font-size: 0.68rem; color: #cbd5e1; }
.trmh i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.trmh span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trmh b { color: var(--gold); }
.trmg { display: flex; flex-direction: column; gap: 2px; margin-top: 3px; }
.trmr { display: grid; grid-template-columns: repeat(12, 1fr); gap: 1px; }
.trmr.locked { opacity: 0.5; }
.trmr i { height: 5px; border-radius: 1px; background: rgba(255,255,255,0.14); display: block; }
.trmr i.on { background: var(--gem); }
.trmr i.chest { background: rgba(255,255,255,0.28); }
.trmr i.chest.on { background: var(--gem); }

/* Ship, Captain & Crew: the ship deck with three sockets, the sea, the cargo hold and the round table */
.scwrap { justify-content: flex-start; gap: 8px; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
.scrounds { display: flex; flex-wrap: wrap; gap: 4px 10px; justify-content: center; width: 100%; }
.scrow { display: flex; align-items: center; gap: 5px; font-size: 0.78rem; color: #cbd5e1; padding: 2px 8px; border-radius: 8px; border: 1px solid transparent; }
.scrow.on { border-color: var(--gold); }
.scrow.head { font-weight: 800; color: var(--gold); }
.scrow i { width: 8px; height: 8px; border-radius: 2px; }
.scrow b { color: var(--gold); min-width: 1.2em; text-align: right; }
.scv { min-width: 26px; text-align: center; padding: 1px 6px; border-radius: 6px; background: rgba(255,255,255,0.1); }
.scv.done { background: rgba(251,191,36,0.25); color: var(--gold); font-weight: 800; }
.scdeck { position: relative; width: 100%; max-width: 380px; }
.scdeck > svg { display: block; width: 100%; height: auto; }
.scsea { display: flex; gap: 12px; justify-content: center; min-height: 52px; margin-top: 14px; }
.scsea .die { --s: clamp(32px, 10vw, 44px); }
.scsea.empty { visibility: hidden; }
.scpips { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 0.78rem; color: var(--muted); flex-wrap: wrap; }
.scpips i { width: 11px; height: 11px; border-radius: 50%; border: 1px solid var(--line); }
.scpips i.on { background: var(--gold); border-color: var(--gold); }
.scpips em { flex-basis: 100%; text-align: center; font-style: normal; color: var(--gold); font-weight: 700; font-size: 0.9rem; min-height: 1.2em; }

/* Ship, Captain & Crew, version 3: the freighter. The real dice are laid over the squares of the picture (wheelhouse and the three containers) */
.scdeck { container-type: inline-size; }
.scsq { position: absolute; width: 11.333%; aspect-ratio: 1; display: grid; place-items: center; }
.scsq.pop { animation: scpop 0.35s ease-out; }
.scsq svg, .scsq .fdie { display: block; width: 100%; height: 100%; }
.scdeck .ghost { opacity: 0.35; }
.scdeck .unghost { animation: scunghost 0.35s ease-out; }
.scdeck .fig { transform-box: fill-box; transform-origin: 50% 100%; }
.scdeck .fig.out { opacity: 0.28; }
.scdeck .fig.skip { opacity: 0.2; }
.scdeck .fig.pop { animation: scpop 0.35s ease-out; }
.scdeck .bdg.skip { opacity: 0.3; }
@media (prefers-reduced-motion: reduce) { .scsq.pop, .scdeck .fig.pop, .scdeck .unghost { animation: none; } }
@keyframes scunghost { from { opacity: 0.35; } to { opacity: 1; } }
@keyframes scpop { 0% { transform: scale(0.6); opacity: 0; } 60% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); } }
.schw { display: flex; flex-direction: column; align-items: center; position: relative; width: 100%; height: 100%; }
.schw .dieBtn { min-width: 0; min-height: 0; padding: 0; width: 100%; height: 100%; display: grid; place-items: center; border-radius: 8px; }
.schw .holdTag { position: absolute; left: 0; right: 0; top: 100%; text-align: center; font-size: 0.55rem; font-weight: 800; color: var(--gold); min-height: 8px; line-height: 8px; margin-top: 2px; text-shadow: 0 1px 2px rgba(0,0,0,0.7); }

/* Freighter art (Ship, Captain & Crew): the user's three drawings, class names prefixed fr-, cp-, cw- (see src/ui/freighter-art.js) */
.fr-outline { stroke: #000000; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; } .fr-cabin-light { fill: #E4F0FA; } .fr-cabin-shade { fill: #C0D8EB; } .fr-deck-light { fill: #D1D6DD; } .fr-deck-shade { fill: #AEB5BF; } .fr-container-dark { fill: #E39F4D; } .fr-container-light { fill: #F9B863; } .fr-hull-red { fill: #F14B3B; } .fr-hull-red-shade { fill: #DC382A; } .fr-hull-teal { fill: #25D5DF; } .fr-hull-teal-shade { fill: #18BBC5; }
.cp-ink { stroke: #12151C; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; } .cp-ink-thin { stroke: #12151C; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; } .cp-skin { fill: #F4D2BE; } .cp-skin-shade { fill: #E3B69E; } .cp-shirt { fill: #5BA1D7; } .cp-shirt-shade { fill: #4488BE; } .cp-hat-black { fill: #1A1E26; } .cp-hat-band { fill: #11141A; } .cp-gold { fill: #E6B83A; } .cp-gold-stroke { stroke: #E6B83A; stroke-linecap: round; stroke-linejoin: round; fill: none; } .cp-hair { fill: #F3D152; } .cp-pants { fill: #F4F5F7; } .cp-pants-shade { fill: #D9DEE5; } .cp-shoes { fill: #5BA1D7; } .cp-shoes-sole { fill: #3E7BAE; }
.cw-ink { stroke: #1A1718; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; } .cw-ink-thin { stroke: #1A1718; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; } .cw-skin { fill: #F3D1BE; } .cw-skin-shade { fill: #E0B59E; } .cw-hair { fill: #3E2418; } .cw-hat { fill: #F4F5F7; } .cw-hat-shade { fill: #D5DAE2; } .cw-sweater { fill: #C84438; } .cw-sweater-shade { fill: #A63329; } .cw-shirt-white { fill: #F4F5F7; } .cw-jeans { fill: #6998B5; } .cw-jeans-shade { fill: #527C96; } .cw-shoe { fill: #F4F5F7; } .cw-shoe-sole { fill: #DCDFE6; }
