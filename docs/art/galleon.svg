<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" width="800" height="680">
  <defs>
    <style>
      .sail {
        fill: #2B2B2B;
        stroke: #111111;
        stroke-width: 2;
        stroke-linejoin: round;
      }
      .hull-main {
        fill: #2C2C2C;
        stroke: #111111;
        stroke-width: 2.5;
        stroke-linejoin: round;
      }
      .hull-dark {
        fill: #1A1A1A;
        stroke: #111111;
        stroke-width: 2;
        stroke-linejoin: round;
      }
      .hull-mid {
        fill: #3E3E3E;
        stroke: #111111;
        stroke-width: 1.8;
      }
      .mast {
        fill: #1A1A1A;
        stroke: #111111;
        stroke-width: 1.5;
      }
      .rigging {
        stroke: #181818;
        stroke-width: 1.8;
        stroke-linecap: round;
        fill: none;
      }
      .rigging-thin {
        stroke: #222222;
        stroke-width: 1.1;
        stroke-linecap: round;
        fill: none;
      }
      .trim-silver {
        fill: #BCC6C2;
        stroke: #111111;
        stroke-width: 1.8;
        stroke-linejoin: round;
      }
    </style>

    <!-- Reusable Gunport Window -->
    <g id="gunport">
      <rect x="-6" y="-8" width="12" height="14" rx="1" fill="#141414" stroke="#0B0B0B" stroke-width="1.5"/>
      <rect x="-3.5" y="-5.5" width="7" height="9" fill="#3B3B3B"/>
      <line x1="-8" y1="-8" x2="8" y2="-8" stroke="#111111" stroke-width="2"/>
    </g>
  </defs>

  <!-- RIGGING & STAYS (Behind Sails) -->
  <g id="rigging-back">
    <!-- Fore stays to Bowsprit -->
    <line class="rigging" x1="552" y1="92" x2="736" y2="462"/>
    <line class="rigging" x1="552" y1="122" x2="736" y2="462"/>
    <line class="rigging" x1="546" y1="205" x2="732" y2="464"/>
    <line class="rigging" x1="546" y1="215" x2="684" y2="495"/>

    <!-- Main to Fore Stays -->
    <line class="rigging" x1="332" y1="62" x2="544" y2="108"/>
    <line class="rigging" x1="332" y1="154" x2="544" y2="122"/>
    <line class="rigging" x1="332" y1="158" x2="544" y2="205"/>
    <line class="rigging" x1="332" y1="162" x2="532" y2="338"/>
    <line class="rigging" x1="322" y1="382" x2="538" y2="518"/>
    <line class="rigging" x1="322" y1="392" x2="492" y2="528"/>

    <!-- Mizzen to Main Stays -->
    <line class="rigging" x1="184" y1="276" x2="322" y2="160"/>
    <line class="rigging" x1="184" y1="282" x2="322" y2="168"/>
    <line class="rigging" x1="182" y1="364" x2="316" y2="384"/>
    <line class="rigging" x1="172" y1="364" x2="255" y2="515"/>
    <line class="rigging" x1="74" y1="338" x2="176" y2="278"/>

    <!-- Backstays -->
    <line class="rigging" x1="542" y1="205" x2="490" y2="532"/>
    <line class="rigging" x1="546" y1="205" x2="518" y2="526"/>
    <line class="rigging" x1="320" y1="160" x2="262" y2="515"/>
    <line class="rigging" x1="318" y1="378" x2="260" y2="512"/>
    <line class="rigging" x1="324" y1="378" x2="306" y2="535"/>
  </g>

  <!-- SHROUDS & RATLINES -->
  <g id="shrouds">
    <!-- Mainmast Shrouds -->
    <path class="rigging" d="M 314,380 L 256,518 M 317,380 L 270,526 M 320,380 L 284,532 M 323,380 L 298,536 M 326,380 L 308,538"/>
    <!-- Mainmast Ratlines -->
    <g class="rigging-thin">
      <line x1="308" y1="395" x2="326" y2="395"/>
      <line x1="302" y1="410" x2="324" y2="410"/>
      <line x1="296" y1="425" x2="322" y2="425"/>
      <line x1="290" y1="440" x2="320" y2="440"/>
      <line x1="284" y1="455" x2="318" y2="455"/>
      <line x1="278" y1="470" x2="316" y2="470"/>
      <line x1="272" y1="485" x2="314" y2="485"/>
      <line x1="266" y1="500" x2="312" y2="500"/>
      <line x1="260" y1="515" x2="310" y2="515"/>
    </g>

    <!-- Mizzenmast Shrouds -->
    <path class="rigging" d="M 176,368 L 154,485 M 180,368 L 166,488 M 184,368 L 178,490"/>
    <g class="rigging-thin">
      <line x1="173" y1="385" x2="184" y2="385"/>
      <line x1="170" y1="400" x2="184" y2="400"/>
      <line x1="167" y1="415" x2="183" y2="415"/>
      <line x1="164" y1="430" x2="182" y2="430"/>
      <line x1="161" y1="445" x2="181" y2="445"/>
      <line x1="158" y1="460" x2="180" y2="460"/>
      <line x1="155" y1="475" x2="179" y2="475"/>
    </g>
  </g>

  <!-- MASTS, YARDS & BOWSPRIT -->
  <g id="masts">
    <!-- Bowsprit & Dolphin Striker -->
    <polygon class="mast" points="586,522 764,448 766,454 588,530"/>
    <polygon class="mast" points="586,525 566,488 571,486 591,523"/>

    <!-- Mizzenmast -->
    <rect class="mast" x="176" y="236" width="6" height="254"/>
    <!-- Mizzen Yards & Tops -->
    <rect class="mast" x="166" y="264" width="26" height="4" rx="1"/>
    <rect class="mast" x="169" y="286" width="20" height="4" rx="1"/>
    <rect class="mast" x="166" y="362" width="26" height="5" rx="1"/>
    <rect class="mast" x="170" y="378" width="22" height="3.5" rx="1"/>
    <!-- Spanker Gaff -->
    <line class="rigging" stroke-width="3.5" x1="180" y1="376" x2="72" y2="335"/>

    <!-- Mainmast -->
    <rect class="mast" x="318" y="10" width="8" height="532"/>
    <!-- Main Yards & Tops -->
    <rect class="mast" x="312" y="42" width="20" height="4" rx="1"/>
    <rect class="mast" x="314" y="60" width="24" height="4" rx="1"/>
    <rect class="mast" x="296" y="152" width="48" height="5" rx="1"/>
    <rect class="mast" x="306" y="172" width="32" height="4" rx="1"/>
    <rect class="mast" x="290" y="375" width="48" height="6" rx="1"/>
    <rect class="mast" x="304" y="388" width="28" height="4" rx="1"/>

    <!-- Foremast -->
    <rect class="mast" x="542" y="38" width="7.5" height="492"/>
    <!-- Fore Yards & Tops -->
    <rect class="mast" x="536" y="88" width="20" height="4" rx="1"/>
    <rect class="mast" x="528" y="106" width="40" height="4.5" rx="1"/>
    <rect class="mast" x="516" y="201" width="48" height="5" rx="1"/>
    <rect class="mast" x="524" y="218" width="34" height="4" rx="1"/>
    <rect class="mast" x="516" y="394" width="46" height="5.5" rx="1"/>
  </g>

  <!-- SAILS -->
  <g id="sails">
    <!-- Mizzen Spanker (Gaff Sail) -->
    <path class="sail" d="M 74,338
      C 120,378 188,424 270,476
      C 210,466 144,458 90,454
      C 84,414 78,376 74,338 Z"/>

    <!-- Mizzen Topsail -->
    <path class="sail" d="M 171,290
      L 194,290
      C 218,310 230,338 220,368
      C 216,360 212,356 206,356
      C 194,358 182,362 170,368
      C 182,342 182,314 171,290 Z"/>

    <!-- Main Topgallant Sail -->
    <path class="sail" d="M 316,72
      L 340,72
      C 364,92 374,122 362,146
      C 358,138 352,136 346,138
      C 338,140 332,144 328,148
      C 336,122 332,94 316,72 Z"/>

    <!-- Main Topsail -->
    <path class="sail" d="M 314,174
      L 342,174
      C 382,216 398,284 364,344
      C 362,332 358,326 350,326
      C 334,328 316,336 298,346
      C 328,300 332,232 314,174 Z"/>

    <!-- Main Staysail (Triangular) -->
    <path class="sail" d="M 388,210
      C 424,250 472,294 528,336
      C 482,332 436,332 392,336
      C 394,294 392,250 388,210 Z"/>

    <!-- Fore Topgallant Sail -->
    <path class="sail" d="M 540,118
      L 564,118
      C 588,138 598,168 584,194
      C 580,186 574,184 568,186
      C 560,188 554,192 550,196
      C 558,170 554,140 540,118 Z"/>

    <!-- Fore Topsail -->
    <path class="sail" d="M 536,220
      L 562,220
      C 596,262 608,328 576,382
      C 574,370 570,364 562,364
      C 548,366 532,374 516,382
      C 544,336 548,274 536,220 Z"/>

    <!-- Fore Course (Lower Split / Furled Edge) -->
    <path class="sail" d="M 522,404
      L 542,404
      C 554,436 558,472 554,504
      C 536,500 518,504 504,512
      C 526,480 530,440 522,404 Z"/>

    <!-- Inner Jib -->
    <path class="sail" d="M 556,412
      C 592,438 632,464 676,486
      C 634,486 594,492 566,502
      C 568,472 564,440 556,412 Z"/>

    <!-- Flying / Outer Jib -->
    <path class="sail" d="M 636,334
      C 666,376 696,422 726,466
      C 694,458 664,454 638,454
      C 642,414 640,374 636,334 Z"/>
  </g>

  <!-- SHIP HULL & DETAILS -->
  <g id="hull">
    <!-- Stern Lantern -->
    <g id="stern-lantern" transform="translate(52, 434)">
      <path class="hull-dark" d="M -2,16 L 2,34 L 6,34 L 4,16 Z"/>
      <polygon class="hull-mid" points="-8,-6 8,-6 6,14 -6,14"/>
      <polygon class="hull-dark" points="-10,-8 10,-8 6,-14 -6,-14"/>
      <line x1="0" y1="-14" x2="0" y2="-19" stroke="#111111" stroke-width="2"/>
      <!-- Lantern Mullions -->
      <line x1="-3" y1="-6" x2="-2" y2="14" stroke="#111111" stroke-width="1.4"/>
      <line x1="3" y1="-6" x2="2" y2="14" stroke="#111111" stroke-width="1.4"/>
      <line x1="-7" y1="4" x2="7" y2="4" stroke="#111111" stroke-width="1.4"/>
    </g>

    <!-- Poop Deck / Quarterdeck Railings & Belaying Pins -->
    <g id="deck-fittings">
      <!-- Quarterdeck Rail -->
      <rect x="150" y="502" width="96" height="5" class="hull-dark"/>
      <line class="rigging" x1="162" y1="507" x2="162" y2="518"/>
      <line class="rigging" x1="178" y1="507" x2="178" y2="518"/>
      <line class="rigging" x1="194" y1="507" x2="194" y2="518"/>
      <line class="rigging" x1="210" y1="507" x2="210" y2="518"/>
      <line class="rigging" x1="226" y1="507" x2="226" y2="518"/>
      <line class="rigging" x1="242" y1="507" x2="242" y2="518"/>
      <!-- Small Deck Cannon / Capstan -->
      <rect x="196" y="494" width="12" height="8" rx="1" class="hull-dark"/>

      <!-- Main Waist Bulwark Rail & Pins -->
      <path class="hull-dark" d="M 248,536 L 516,536 L 516,542 L 248,542 Z"/>
      <line class="rigging" x1="274" y1="530" x2="274" y2="546"/>
      <line class="rigging" x1="286" y1="530" x2="286" y2="546"/>
      <line class="rigging" x1="298" y1="530" x2="298" y2="546"/>
      <line class="rigging" x1="310" y1="530" x2="310" y2="546"/>
      <line class="rigging" x1="376" y1="530" x2="376" y2="546"/>
      <line class="rigging" x1="454" y1="530" x2="454" y2="546"/>
      <line class="rigging" x1="466" y1="530" x2="466" y2="546"/>
      <line class="rigging" x1="478" y1="530" x2="478" y2="546"/>

      <!-- Forecastle Deck & Cannon -->
      <rect x="498" y="524" width="26" height="10" rx="2" class="hull-dark"/>
      <rect x="520" y="514" width="66" height="6" class="hull-dark"/>
    </g>

    <!-- Main Lower Hull & Keel -->
    <path class="hull-main" d="M 52,464
      L 150,492
      L 150,516
      L 246,516
      L 254,544
      L 516,544
      L 522,520
      L 588,520
      L 596,544
      C 634,542 664,532 682,516
      L 688,528
      C 666,574 620,624 566,662
      L 116,662
      L 114,612
      L 124,612
      L 112,576
      L 96,568
      L 84,536
      L 66,528
      L 52,494
      Z"/>

    <!-- Rudder -->
    <path class="hull-dark" d="M 114,612 L 128,612 L 132,662 L 116,662 Z"/>

    <!-- Longitudinal Hull Wales / Rubbing Strakes -->
    <path class="hull-dark" d="M 96,568 C 254,598 468,604 654,578 L 646,588 C 464,614 252,608 106,578 Z"/>
    <path class="hull-dark" d="M 112,598 C 266,622 464,626 626,606 L 616,616 C 458,634 264,630 118,608 Z"/>

    <!-- Stern Gallery Windows & Silver-Grey Roof Trim -->
    <g id="stern-gallery">
      <!-- Gallery Lower Molding -->
      <path class="hull-dark" d="M 56,518 L 138,540 L 142,548 L 60,526 Z"/>
      <!-- Gallery Window Frame -->
      <polygon class="hull-mid" points="52,488 134,510 138,538 56,516"/>
      <!-- 3 Arched Windows -->
      <path class="hull-dark" d="M 60,494 L 78,499 L 80,518 L 62,513 Z"/>
      <path class="hull-dark" d="M 84,500 L 102,505 L 104,524 L 86,519 Z"/>
      <path class="hull-dark" d="M 108,507 L 126,512 L 128,531 L 110,526 Z"/>
      <!-- Light Sage/Silver Canopy Roof -->
      <path class="trim-silver" d="M 48,486
        C 52,478 60,478 72,481
        L 128,496
        C 136,498 140,504 138,512
        L 48,488 Z"/>
    </g>

    <!-- Beakhead Grating & Silver Angel Figurehead -->
    <g id="bow-details">
      <!-- Beakhead Rails -->
      <path class="rigging" stroke-width="2.5" d="M 594,544 C 626,544 654,536 676,520"/>
      <path class="rigging" stroke-width="2.5" d="M 596,554 C 626,554 652,546 672,532"/>
      <line class="rigging" x1="612" y1="544" x2="612" y2="564"/>
      <line class="rigging" x1="628" y1="542" x2="628" y2="562"/>
      <line class="rigging" x1="644" y1="538" x2="644" y2="556"/>
      <line class="rigging" x1="660" y1="532" x2="660" y2="548"/>

      <!-- Angel Figurehead -->
      <path class="trim-silver" d="M 664,534
        C 672,526 678,516 686,516
        C 692,516 696,520 704,516
        L 702,522
        C 696,526 692,528 692,534
        C 692,542 686,554 674,562
        C 672,554 674,546 672,540
        C 668,542 664,540 664,534 Z"/>
      <!-- Figurehead Wing -->
      <path class="trim-silver" d="M 676,524 C 668,522 662,526 660,532 C 666,532 672,530 676,528 Z"/>
    </g>

    <!-- Gunports Along Hull -->
    <g id="gunports">
      <!-- Upper Tier -->
      <use href="#gunport" x="184" y="534"/>
      <use href="#gunport" x="228" y="538"/>

      <!-- Main Gun Deck Tier -->
      <use href="#gunport" x="156" y="564"/>
      <use href="#gunport" x="206" y="568"/>
      <use href="#gunport" x="256" y="572"/>
      <use href="#gunport" x="306" y="574"/>
      <use href="#gunport" x="356" y="575"/>
      <use href="#gunport" x="406" y="575"/>
      <use href="#gunport" x="456" y="574"/>
      <use href="#gunport" x="506" y="572"/>
      <use href="#gunport" x="556" y="569"/>
      <use href="#gunport" x="606" y="564"/>
    </g>

    <!-- Boarding Ladder / Steps Amidships -->
    <g id="boarding-ladder">
      <rect x="378" y="544" width="12" height="58" fill="#1A1A1A" stroke="#111111" stroke-width="1.5"/>
      <line x1="378" y1="552" x2="390" y2="552" stroke="#4A4A4A" stroke-width="2"/>
      <line x1="378" y1="560" x2="390" y2="560" stroke="#4A4A4A" stroke-width="2"/>
      <line x1="378" y1="568" x2="390" y2="568" stroke="#4A4A4A" stroke-width="2"/>
      <line x1="378" y1="576" x2="390" y2="576" stroke="#4A4A4A" stroke-width="2"/>
      <line x1="378" y1="584" x2="390" y2="584" stroke="#4A4A4A" stroke-width="2"/>
      <line x1="378" y1="592" x2="390" y2="592" stroke="#4A4A4A" stroke-width="2"/>
    </g>
  </g>

  <!-- TRANSLUCENT WATERLINE OVERLAY -->
  <g id="water">
    <rect x="0" y="612" width="800" height="68" fill="#00A8E8" fill-opacity="0.52"/>
    <line x1="0" y1="612" x2="800" y2="612" stroke="#5CE1E6" stroke-width="2.5" stroke-opacity="0.8"/>
  </g>
</svg>
