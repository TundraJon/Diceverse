<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 540" width="280" height="540">
  <defs>
    <style>
      .ink {
        stroke: #1A1718;
        stroke-width: 2.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .ink-thin {
        stroke: #1A1718;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .skin { fill: #F3D1BE; }
      .skin-shade { fill: #E0B59E; }
      .hair { fill: #3E2418; }
      .hat { fill: #F4F5F7; }
      .hat-shade { fill: #D5DAE2; }
      .sweater { fill: #C84438; }
      .sweater-shade { fill: #A63329; }
      .shirt-white { fill: #F4F5F7; }
      .jeans { fill: #6998B5; }
      .jeans-shade { fill: #527C96; }
      .shoe { fill: #F4F5F7; }
      .shoe-sole { fill: #DCDFE6; }
    </style>
  </defs>

  <!-- SNEAKERS -->
  <g id="shoes">
    <!-- Far / Viewer's Right Sneaker -->
    <g id="shoe-right">
      <path class="shoe ink" d="M 152,452
        C 162,448 176,447 188,450
        C 202,453 216,458 218,464
        C 219,469 214,473 204,474
        L 150,473
        C 145,472 144,466 146,460
        Z" />
      <path class="shoe-sole ink-thin" d="M 146,465 C 166,467 196,467 217,463" />
      <path class="ink-thin" fill="none" d="M 178,450 C 182,455 184,460 183,465" />
      <path class="ink-thin" fill="none" d="M 164,452 L 172,454" />
      <path class="ink-thin" fill="none" d="M 168,456 L 176,458" />
    </g>

    <!-- Near / Viewer's Left Sneaker -->
    <g id="shoe-left">
      <path class="shoe ink" d="M 88,464
        C 100,458 118,457 134,460
        C 152,463 172,468 174,476
        C 175,482 169,486 156,487
        L 86,487
        C 78,486 76,479 80,472
        Z" />
      <path class="shoe-sole ink-thin" d="M 79,477 C 106,480 146,480 173,475" />
      <path class="ink-thin" fill="none" d="M 126,460 C 132,466 134,472 133,478" />
      <path class="ink-thin" fill="none" d="M 108,462 L 118,465" />
      <path class="ink-thin" fill="none" d="M 114,467 L 123,470" />
    </g>
  </g>

  <!-- BELL-BOTTOM JEANS -->
  <g id="jeans">
    <!-- Far / Viewer's Right Leg -->
    <path class="jeans-shade ink" d="M 134,282
      C 142,312 146,342 144,372
      C 142,402 132,434 126,458
      C 146,462 174,461 190,456
      C 180,428 170,398 168,368
      C 166,338 170,308 168,280
      Z" />
    <path class="ink-thin" fill="none" d="M 156,374 C 154,404 150,432 148,459" />

    <!-- Near / Viewer's Left Leg -->
    <path class="jeans ink" d="M 96,282
      C 96,314 100,344 98,374
      C 95,406 82,440 72,472
      C 96,478 130,476 146,470
      C 138,438 130,406 130,374
      C 130,348 136,324 142,306
      L 158,282
      Z" />
    <!-- Outseam, pocket & knee creases -->
    <path class="ink-thin" fill="none" d="M 112,306 C 114,336 114,366 110,396 C 106,426 98,452 94,474" />
    <path class="ink-thin" fill="none" d="M 102,298 C 112,304 118,312 118,322" />
    <path class="ink-thin" fill="none" d="M 122,368 C 127,372 130,376 130,382" />
    <path class="ink-thin" fill="none" d="M 136,312 C 142,314 148,312 152,308" />
  </g>

  <!-- FAR ARM / HAND -->
  <g id="arm-right">
    <path class="skin ink" d="M 164,274
      C 172,276 182,282 184,290
      C 185,295 181,301 176,304
      C 172,306 166,305 162,302
      L 158,284 Z" />
    <path class="ink-thin" fill="none" d="M 176,288 C 178,292 176,297 172,300" />
  </g>

  <!-- TORSO: RED V-NECK SWEATER & WHITE COLLARED SHIRT -->
  <g id="torso">
    <!-- Main Sweater Body -->
    <path class="sweater ink" d="M 124,132
      C 108,142 94,158 84,182
      C 76,204 74,234 78,284
      C 104,290 144,288 168,282
      C 172,244 174,202 172,168
      C 170,150 162,138 152,132
      Z" />

    <!-- Subtle Sweater Shading -->
    <path class="sweater-shade" d="M 156,138 C 166,154 168,214 166,281 L 154,283 C 158,220 156,162 148,140 Z" />

    <!-- White Undershirt V-Inset -->
    <path class="shirt-white ink" d="M 124,132 L 138,176 L 156,142 L 152,132 Z" />
    <path class="ink-thin" fill="none" d="M 142,148 L 140,172" />

    <!-- White Shirt Collar Flaps -->
    <path class="shirt-white ink" d="M 126,126 L 114,142 L 122,158 L 136,144 Z" />
    <path class="shirt-white ink" d="M 152,128 L 164,144 L 158,158 L 146,144 Z" />

    <!-- Sweater Ribbed Hemline -->
    <path class="ink-thin" fill="none" d="M 79,274 C 106,279 144,278 168,272" />
    <path class="ink-thin" fill="none" d="M 114,224 C 128,226 144,225 156,222" />
  </g>

  <!-- NEAR / VIEWER'S LEFT ARM & HAND -->
  <g id="arm-left">
    <!-- Long Red Sleeve -->
    <path class="sweater ink" d="M 102,152
      C 88,168 78,192 74,218
      C 72,238 74,264 76,286
      L 106,286
      C 106,262 106,236 108,216
      C 110,198 114,182 118,168" />
    <!-- Sleeve Cuff & Elbow Fold -->
    <path class="ink-thin" fill="none" d="M 76,276 L 106,276" />
    <path class="ink-thin" fill="none" d="M 88,218 C 94,220 100,218 105,214" />

    <!-- Relaxed Hand -->
    <path class="skin ink" d="M 78,286
      C 76,298 76,312 80,322
      C 82,326 86,326 87,320
      C 88,326 91,329 94,328
      C 97,327 97,320 97,314
      C 99,320 102,325 105,323
      C 107,321 106,312 104,304
      C 108,308 113,310 116,307
      C 118,304 114,296 108,292
      L 104,286 Z" />
    <path class="ink-thin" fill="none" d="M 87,306 L 87,320" />
    <path class="ink-thin" fill="none" d="M 96,304 L 97,315" />
  </g>

  <!-- HEAD, HAIR & CLASSIC WHITE BUCKET HAT -->
  <g id="head">
    <!-- Neck -->
    <path class="skin ink" d="M 132,114 L 130,136 L 142,146 L 152,134 L 152,118 Z" />
    <path class="skin-shade" d="M 134,116 C 140,122 146,125 152,126 L 152,120 L 134,114 Z" />

    <!-- Back Hair Nape -->
    <path class="hair ink" d="M 118,90
      C 108,94 106,106 114,110
      C 111,115 117,120 124,118
      C 127,121 133,120 135,116
      L 132,96 Z" />

    <!-- Face Shape -->
    <path class="skin ink" d="M 128,68
      C 124,78 124,90 126,102
      C 128,112 138,122 152,124
      C 164,125 174,118 178,106
      C 182,94 182,78 176,66
      Z" />

    <!-- Ear -->
    <path class="skin ink" d="M 126,86 C 118,84 116,94 122,100 C 125,102 128,101 129,98" />
    <path class="ink-thin" fill="none" d="M 124,90 C 121,91 121,95 124,96" />

    <!-- Brown Hair Fringe & Sideburns -->
    <path class="hair ink" d="M 126,88
      C 128,80 132,72 138,68
      C 144,72 150,72 156,69
      C 162,72 168,72 174,69
      C 178,74 180,82 179,88
      C 182,80 183,68 176,58
      C 164,48 140,50 128,62
      C 122,68 121,78 126,88 Z" />

    <!-- Facial Features -->
    <path class="ink-thin" fill="none" d="M 142,76 C 145,73 149,73 152,75" />
    <path class="ink-thin" fill="none" d="M 164,75 C 167,73 171,73 173,76" />
    <ellipse fill="#1A1718" cx="147" cy="83" rx="2.1" ry="3.2" />
    <ellipse fill="#1A1718" cx="168" cy="83" rx="2" ry="3.1" />
    <path class="skin ink-thin" d="M 160,82 C 164,87 169,92 167,96 C 165,99 159,99 156,97" />
    <path class="ink-thin" fill="none" d="M 144,103 C 152,108 164,108 171,103" />
    <path class="ink-thin" fill="none" d="M 142,101 C 144,103 144,105 142,107" />
    <path class="ink-thin" fill="none" d="M 153,113 C 157,114 161,114 164,113" />

    <!-- CLASSIC WHITE BUCKET HAT -->
    <g id="bucket-hat">
      <!-- Crown Top -->
      <path class="hat ink" d="M 122,46
        C 134,38 158,38 172,46
        C 182,52 184,62 178,72
        C 160,68 136,68 118,72
        C 112,62 114,52 122,46 Z" />
      <!-- Vertical Stitch Seam / Panel Lines -->
      <path class="ink-thin" fill="none" d="M 147,40 C 146,52 146,62 147,70" />

      <!-- Sloped Downward Brim -->
      <path class="hat ink" d="M 106,68
        C 114,64 132,60 148,60
        C 166,60 184,64 192,68
        C 202,73 198,82 188,86
        C 170,80 148,78 126,86
        C 112,83 100,74 106,68 Z" />
      <!-- Brim Stitching Line -->
      <path class="ink-thin" fill="none" d="M 114,75 C 132,70 162,70 184,75" />
    </g>
  </g>
</svg>
