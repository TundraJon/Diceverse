      C 30,296 42,320 46,336
      C 42,346 39,358 41,368
      C 43,372 47,370 48,363
      C 48,371 50,382 54,383
      C 57,383 58,374 58,366
      C 59,374 61,383 65,383
      C 68,382 68,372 67,364
      C 69,371 72,378 75,376
      C 77,375 76,364 73,355
