    <path class="skin ink" d="M 186,88 C 194,85 198,94 193,102 C 190,106 186,106 184,103" />
    <path class="ink-thin" fill="none" d="M 188,92 C 191,92 191,97 188,99" />

    <!-- Facial Features -->
    <path fill="#12151C" d="M 137,77 C 141,72 149,72 152,76 C 153,78 150,80 148,79 C 145,77 141,78 139,80 C 137,80 136,78 137,77 Z" />
    <path fill="#12151C" d="M 162,77 C 166,73 175,74 178,79 C 179,81 176,83 174,81 C 171,78 166,78 163,80 C 161,80 161,78 162,77 Z" />

    <ellipse fill="#12151C" cx="145" cy="85" rx="2.4" ry="3.2" />
    <ellipse fill="#12151C" cx="168" cy="86" rx="2.4" ry="3.2" />
    <path class="ink-thin" fill="none" d="M 140,90 C 144,91 148,91 151,89" />
    <path class="ink-thin" fill="none" d="M 163,91 C 167,92 171,92 174,90" />

    <path class="skin ink" d="M 153,88 C 147,91 146,99 153,101 C 159,102 164,99 162,94" />

    <path class="ink-thin" fill="none" d="M 141,105 C 150,110 165,110 174,105" />
    <path class="ink-thin" fill="none" d="M 139,103 C 141,105 141,107 139,109" />
    <path class="ink-thin" fill="none" d="M 175,103 C 173,105 173,107 175,109" />
    <path class="ink-thin" fill="none" d="M 152,114 C 156,115 160,115 163,114" />

    <!-- CAPTAIN'S HAT -->
    <g id="captains-hat">
      <!-- Flared Crown -->
      <path class="hat-black ink" d="M 136,56
        C 126,48 122,36 132,27
        C 146,16 178,18 202,32
        C 218,41 220,53 206,62
        C 206,69 203,75 198,78
        C 182,70 154,66 134,68
        Z" />

      <!-- Crown Top Edge Highlight -->
      <path stroke="#384152" stroke-width="1.6" fill="none" stroke-linecap="round" d="M 135,28 C 149,19 178,21 200,34" />

      <!-- Hat Band -->
      <path class="hat-band ink" d="M 135,55 C 156,52 184,56 206,64 L 204,75 C 184,67 156,63 134,66 Z" />

      <!-- Navy Anchor Patch & "CAPTAIN" Text -->
      <g transform="translate(159, 36) rotate(5)">
        <rect x="-11" y="-13" width="22" height="22" rx="2" fill="#182C59" stroke="#0E121A" stroke-width="1.5" />
        <!-- Gold Anchor -->
        <line class="gold-stroke" stroke-width="2" x1="0" y1="-8" x2="0" y2="5" />
        <line class="gold-stroke" stroke-width="1.8" x1="-4" y1="-4" x2="4" y2="-4" />
        <circle class="gold-stroke" stroke-width="1.5" cx="0" cy="-9.5" r="1.8" />
        <path class="gold-stroke" stroke-width="2" d="M -6,1 C -6,6 6,6 6,1" />
        <polyline class="gold-stroke" stroke-width="1.6" points="-7.5,2.5 -6,0.5 -4,2.5" />
        <polyline class="gold-stroke" stroke-width="1.6" points="4,2.5 6,0.5 7.5,2.5" />
        <!-- CAPTAIN Text -->
        <text x="0" y="16" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="6.2" fill="#E6B83A" text-anchor="middle" letter-spacing="0.4">CAPTAIN</text>
      </g>

      <!-- Braided Gold Cord & Side Button -->
      <path class="gold-stroke" stroke-width="3.6" d="M 134,61 C 155,58 180,62 197,68" />
      <path stroke="#8A6414" stroke-width="1.2" stroke-dasharray="2.5 2.5" fill="none" d="M 135,61 C 155,58 180,62 196,68" />
      <line class="gold-stroke" stroke-width="2" x1="197" y1="68" x2="204" y2="71" />
      <circle class="gold" stroke="#12151C" stroke-width="1.4" cx="204" cy="71" r="2.8" />

      <!-- Peak / Visor -->
      <path class="hat-band ink" d="M 134,65
        C 124,69 116,74 118,77
        C 121,79 128,76 136,76
        C 154,77 174,83 188,80
        C 194,78 198,74 198,71
        C 178,64 154,61 134,65 Z" />

      <!-- Gold Laurel Leaves ("Scrambled Eggs") on Visor -->
      <g class="gold-stroke" stroke-width="1.5">
        <!-- Main Right Branch -->
        <path d="M 135,70 C 152,73 170,76 188,73" />
        <path d="M 143,71 L 138,68 M 144,72 L 139,74" />
        <path d="M 152,73 L 147,69 M 153,73 L 148,76" />
        <path d="M 161,74 L 156,70 M 162,74 L 157,77" />
        <path d="M 170,75 L 165,71 M 171,75 L 166,78" />
        <path d="M 179,74 L 174,70 M 180,74 L 175,77" />
        <!-- Left Tip Accent -->
        <path d="M 122,74 L 128,71 M 123,74 L 129,74" />
