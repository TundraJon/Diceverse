  <!-- HEAD, HAIR & CAPTAIN'S HAT -->
  <g id="head">
    <!-- Neck & Chin Base -->
    <path class="skin ink" d="M 136,104 L 136,126 C 146,142 178,142 196,122 L 196,98 Z" />
    <path class="skin-shade" d="M 137,118 C 148,132 174,132 194,116 L 194,122 C 176,138 148,138 137,124 Z" />

    <!-- Blonde Hair Tufts -->
    <path class="hair ink" d="M 136,72
      C 128,72 125,80 129,86
      C 125,90 126,98 133,100
      L 139,94 Z" />
    <path class="hair ink" d="M 186,68
      C 196,68 203,75 200,83
      C 205,87 204,96 198,99
      C 203,103 201,112 193,113
      C 191,118 184,117 182,112
      L 180,82 Z" />

    <!-- Main Face Shape -->
    <path class="skin ink" d="M 138,62
      C 134,72 134,84 134,92
      C 128,98 128,112 138,118
      C 143,121 146,122 148,124
      C 150,131 164,132 168,125
      C 178,124 188,118 191,108
      C 193,102 191,96 188,92
      C 190,82 188,70 182,62
      Z" />

