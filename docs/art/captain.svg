<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 540" width="360" height="540">
  <defs>
    <style>
      .ink {
        stroke: #12151C;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .ink-thin {
        stroke: #12151C;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .skin { fill: #F4D2BE; }
      .skin-shade { fill: #E3B69E; }
      .shirt { fill: #5BA1D7; }
      .shirt-shade { fill: #4488BE; }
      .hat-black { fill: #1A1E26; }
      .hat-band { fill: #11141A; }
      .gold { fill: #E6B83A; }
      .gold-stroke {
        stroke: #E6B83A;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .hair { fill: #F3D152; }
      .pants { fill: #F4F5F7; }
      .pants-shade { fill: #D9DEE5; }
      .shoes { fill: #5BA1D7; }
      .shoes-sole { fill: #3E7BAE; }
    </style>
  </defs>

