<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 960" width="420" height="960">
  <defs>
    <style>
      .ink {
        stroke: #121010;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .skin { fill: #E8B49A; }
      .hair { fill: #26201D; }
      .uniform-red { fill: #9C242D; }
      .uniform-black { fill: #15171A; }
      .uniform-charcoal { fill: #23262B; }
      .gold { fill: #E2B842; }
    </style>
  </defs>

  <!-- LEGS & BOOTS -->
  <g id="legs">
    <!-- Black Trousers -->
    <path class="uniform-black ink" d="M 134,394
      L 278,394
      L 264,634
      L 252,884
      L 210,888
      L 202,526
      L 198,872
      L 164,872
      L 142,638
      L 130,486
      Z" />

    <!-- Left Boot (Angled Outward) -->
    <path class="uniform-black ink" d="M 164,864
      L 198,864
      L 202,894
      L 166,912
      C 150,916 134,915 130,908
      C 128,902 138,894 148,884
      Z" />

    <!-- Right Boot (Forward Facing) -->
    <path class="uniform-black ink" d="M 210,878
      L 252,876
      L 264,902
      C 270,910 272,922 266,928
      C 254,934 234,932 220,922
      L 210,912
      Z" />
  </g>

  <!-- ARMS & HANDS AT SIDES -->
  <g id="arms">
    <!-- Viewer's Left Arm & Hand -->
    <path class="uniform-red ink" d="M 114,204
      L 98,214
      L 102,272
      L 94,492
      L 128,494
      L 132,398
      L 124,254
      Z" />
    <path class="skin ink" d="M 98,492 L 124,493 L 128,534 L 116,548 L 96,544 L 94,516 Z" />

    <!-- Viewer's Right Arm & Hand -->
    <path class="uniform-red ink" d="M 292,204
      L 312,204
      L 318,342
      L 322,492
      L 286,492
      L 282,366
      L 276,226
      Z" />
    <path class="skin ink" d="M 290,492 L 318,492 L 322,534 L 308,548 L 288,542 L 286,514 Z" />
  </g>

  <!-- TORSO (COMMANDER RIKER STARFLEET TUNIC) -->
  <g id="torso">
    <!-- Tunic Base -->
    <path class="uniform-black ink" d="M 176,144
      L 228,144
      L 292,164
      C 306,170 312,184 312,204
      L 278,396
      L 132,396
      L 124,254
      L 98,214
      C 100,192 106,176 122,168
      Z" />

    <!-- Red Tunic Chest -->
    <path class="uniform-red ink" d="M 114,204
      C 168,192 236,192 292,204
      L 276,226
      L 254,344
      L 222,328
      L 140,362
      L 132,306
      L 124,254
      Z" />

    <!-- Black Shoulder Yoke -->
    <path class="uniform-black ink" d="M 176,144
      L 228,144
      L 292,164
      C 306,170 312,184 312,204
      L 292,204
      C 236,192 168,192 114,204
      L 98,214
      C 100,192 106,176 122,168
      Z" />

    <!-- Waistband -->
    <path class="uniform-charcoal ink" d="M 134,376 C 184,382 234,380 278,370 L 277,390 C 234,400 184,402 133,396 Z" />

    <!-- Rank Pips -->
    <g transform="translate(181, 156) rotate(42)">
      <circle cx="0" cy="0" r="2.2" class="gold"/>
      <circle cx="6.5" cy="0" r="2.2" class="gold"/>
      <circle cx="13" cy="0" r="2.2" fill="#15171A" stroke="#E2B842" stroke-width="1.2"/>
    </g>

    <!-- Communicator Badge -->
    <polygon class="gold" stroke="#121010" stroke-width="1.2" points="236,213 244,234 236,228 228,234" />
  </g>

  <!-- HEAD & BEARD -->
  <g id="head">
    <!-- Neck -->
    <path class="skin ink" d="M 176,120 L 176,146 L 195,164 L 226,144 L 224,116 Z" />

    <!-- Face -->
    <path class="skin ink" d="M 164,52
      C 164,34 178,24 195,24
      C 212,24 226,34 226,52
      L 226,88
      C 224,108 214,126 196,128
      C 178,128 168,110 165,88
      Z" />

    <!-- Hair -->
    <path class="hair ink" d="M 161,76
      L 160,46
      C 160,26 176,18 195,18
      C 214,18 228,28 228,48
      L 227,76
      L 221,54
      C 218,42 208,38 195,38
      C 182,38 172,42 169,54
      L 166,76
      Z" />

    <!-- Eyes, Eyebrows & Nose -->
    <path class="ink" fill="none" d="M 170,66 L 188,66 M 202,66 L 220,66" />
    <circle cx="180" cy="73" r="2.5" fill="#121010" />
    <circle cx="210" cy="73" r="2.5" fill="#121010" />
    <path class="ink" fill="none" d="M 195,72 L 190,91 L 200,92" />

    <!-- Beard & Mustache -->
    <path class="hair ink" d="M 164,74
      L 170,96
      C 178,114 212,114 220,96
      L 226,74
      C 226,104 216,128 196,130
      C 176,128 165,104 164,74 Z" />
    <path class="hair ink" d="M 174,108 C 186,98 204,98 216,108 C 204,104 186,104 174,108 Z" />
  </g>
</svg>
