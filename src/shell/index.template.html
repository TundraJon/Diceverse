<script>
// installable and offline: the service worker (sw.js) only on https or localhost, and the app works without it
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', function () { try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {} });
}
</script>
